# Builds an installable test APK on every push to the working branches.
# Download it from the "Test build" release (phone-friendly) or from the
# run's artifacts. Signed with debug keys until a release keystore is set up
# (see docs/RELEASE.md), so it's for testing, not for the Play Store.
name: Build test APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # On-device food recognition: Google AIY Food V1 (Apache-2.0), bundled
      # into the app so scanning is free and works offline.
      - name: Download food model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o assets/models/food_v1.tflite \
            "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite"
          curl -fsSL --retry 3 "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv" \
            | tr -d '\r' > assets/models/food_labels.csv
          test "$(stat -c %s assets/models/food_v1.tflite)" -gt 1000000
          test "$(wc -l < assets/models/food_labels.csv)" -gt 2000
          ls -la assets/models

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Surfaces the Gradle error as an annotation on the run summary, so it's
      # readable without downloading the full log.
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -n -A25 -E "What went wrong|FAILURE:|^e: |error:|Error:" build.log | head -120)
          [ -z "$msg" ] && msg=$(tail -60 build.log)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=APK build failed::$msg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitalarm-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish "Test build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build (latest)
          prerelease: true
          make_latest: false
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.
            Install `app-release.apk` on an Android phone (allow "Install unknown apps" when asked).
            Runs in demo mode until Firebase is connected: any phone number, code 123456.
          files: build/app/outputs/flutter-apk/app-release.apk
