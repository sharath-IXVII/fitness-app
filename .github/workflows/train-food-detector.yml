name: Train food models

# Two-step food recognition, trained from free-licence photos:
#   1. food_detector.tflite - finds every dish on the plate (boxes)
#   2. food_dish.tflite     - names each dish (the app's food ids)
# tools/food_model/run.json picks "quick" (a few dishes, to test the pipeline;
# published to the food-model-test release) or "full" (every dish; published
# to the food-detector release, which the app build bundles).
on:
  push:
    branches: [claude/phase-1-foundation]
    paths: [tools/food_model/**, .github/workflows/train-food-detector.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.m.outputs.full }}
      parts: ${{ steps.m.outputs.parts }}
      models: ${{ steps.m.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          # "resume" redoes only part 0, split three ways (it is the biggest);
          # the other parts are already saved in the food-dataset release.
          echo 'models=["detector","dish"]' >> "$GITHUB_OUTPUT"
          # "more" adds Openverse photos for every dish (parts 10-17) and retrains the dish model.
          # "train" only retrains both models on the data already collected.
          if grep -q '"train"' tools/food_model/run.json; then
            echo 'full=true' >> "$GITHUB_OUTPUT"; echo 'parts=[]' >> "$GITHUB_OUTPUT"
          elif grep -q '"more"' tools/food_model/run.json; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'parts=[{"part":10,"split":"0"},{"part":11,"split":"1"},{"part":12,"split":"2"},{"part":13,"split":"3"},{"part":14,"split":"4"},{"part":15,"split":"5"},{"part":16,"split":"6"},{"part":17,"split":"7"}]' >> "$GITHUB_OUTPUT"
            echo 'tasks=openverse' >> "$GITHUB_OUTPUT"
            echo 'models=["dish"]' >> "$GITHUB_OUTPUT"
          elif grep -q '"resume"' tools/food_model/run.json; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'parts=[{"part":0,"tasks":"dishes"},{"part":8,"tasks":"thali"},{"part":9,"tasks":"hf"}]' >> "$GITHUB_OUTPUT"
          elif grep -q '"full"' tools/food_model/run.json; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'parts=[{"part":0,"tasks":"dishes"},{"part":1,"tasks":"dishes"},{"part":2,"tasks":"dishes"},{"part":3,"tasks":"dishes"},{"part":4,"tasks":"dishes"},{"part":5,"tasks":"dishes"},{"part":6,"tasks":"dishes"},{"part":7,"tasks":"dishes"},{"part":8,"tasks":"thali"},{"part":9,"tasks":"hf"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"; echo 'parts=[{"part":0,"tasks":"dishes"}]' >> "$GITHUB_OUTPUT"
          fi

  label:
    needs: setup
    if: needs.setup.outputs.parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.setup.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40" datasets pillow requests scipy sentencepiece protobuf
      - name: Collect photos and label them
        env:
          DATA_DIR: ${{ runner.temp }}/data
          PART: ${{ matrix.job.part }}
          SPLIT: ${{ matrix.job.split || matrix.job.part }}
          TASKS: ${{ matrix.job.tasks || 'openverse' }}
          PARTS: ${{ needs.setup.outputs.full == 'true' && '8' || '1' }}
          PER_DISH: ${{ needs.setup.outputs.full == 'true' && '120' || '8' }}
          ONLY: ${{ needs.setup.outputs.full != 'true' && 'roti,dal,gulab_jamun,idli,rice' || '' }}
        run: python tools/food_model/build_dataset.py
      - name: Save this part
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.full == 'true' && 'food-dataset' || 'food-model-test' }}
        run: |
          cd "${{ runner.temp }}/data"
          zip -qr "food_part${{ matrix.job.part }}.zip" "part${{ matrix.job.part }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" \
                 --notes "Food model training files (free-licence photos; credits in credits.csv)." || true
          gh release upload "$TAG" "food_part${{ matrix.job.part }}.zip" --clobber --repo "$GITHUB_REPOSITORY"

  merge:
    needs: [setup, label]
    if: ${{ !cancelled() && needs.setup.outputs.parts != '[]' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.setup.outputs.full == 'true' && 'food-dataset' || 'food-model-test' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge parts
        shell: bash -x {0}
        env:
          DATA_DIR: ${{ runner.temp }}/data
          MODE: merge
        run: |
          pip install --quiet pillow requests
          mkdir -p "$DATA_DIR" && cd "$DATA_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'food_part*.zip'
          for z in food_part*.zip; do unzip -qo "$z"; done
          cd "$GITHUB_WORKSPACE" && python tools/food_model/build_dataset.py
          cd "$DATA_DIR" && zip -qr food_dataset.zip det cls credits.csv
          gh release upload "$TAG" food_dataset.zip credits.csv --clobber --repo "$GITHUB_REPOSITORY"

  train:
    needs: [setup, merge]
    if: ${{ !cancelled() && needs.setup.outputs.full != '' && needs.merge.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.setup.outputs.models) }}
    env:
      TAG: ${{ needs.setup.outputs.full == 'true' && 'food-dataset' || 'food-model-test' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install --quiet mediapipe-model-maker
      - name: Get dataset
        run: |
          sudo mkdir -p /content && sudo chown "$USER" /content
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern food_dataset.zip --dir /content
          unzip -q /content/food_dataset.zip -d /content/data
      - name: Train the detector
        if: matrix.model == 'detector'
        env:
          DATA_DIR: /content/data/det
          OUT_DIR: /content/out
          EPOCHS: ${{ needs.setup.outputs.full == 'true' && '12' || '2' }}
        run: python tools/food_model/train_food_detector.py
      - name: Train the dish classifier
        if: matrix.model == 'dish'
        env:
          DATA_DIR: /content/data
          OUT_DIR: /content/out
          EPOCHS: ${{ needs.setup.outputs.full == 'true' && '30' || '2' }}
          MIN_PHOTOS: ${{ needs.setup.outputs.full == 'true' && '8' || '3' }}
        run: python tools/food_model/train_dish_keras.py
      - name: Publish
        env:
          OUT_TAG: ${{ needs.setup.outputs.full == 'true' && 'food-detector' || 'food-model-test' }}
        run: |
          gh release view "$OUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$OUT_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Food models" \
                 --notes "On-device food models built by the Train food models workflow." || true
          # Keep the first dish model as a backup before it is replaced.
          if [ "${{ matrix.model }}" = dish ] && ! gh release view food-model-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/v1 && gh release download "$OUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'food_dish*' --dir /tmp/v1 \
              && gh release create food-model-v1 --repo "$GITHUB_REPOSITORY" --prerelease --title "Food dish model v1 (backup)" \
                   --notes "First 112-dish model: top-1 53%, top-3 72% on held-out photos." /tmp/v1/* || true
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern credits.csv --dir /content/out --clobber
          mv /content/out/credits.csv /content/out/food_model_credits.csv
          gh release upload "$OUT_TAG" /content/out/food_* --clobber --repo "$GITHUB_REPOSITORY"
