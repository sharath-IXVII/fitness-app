name: Train food model

# Trains a phone-sized Indian-food model on GitHub's servers and publishes it as
# a downloadable artifact. Run it by hand: Actions -> "Train food model" -> Run workflow.
# Needs two repository secrets from a free Kaggle account (Settings -> Create New API Token):
#   KAGGLE_USERNAME and KAGGLE_KEY
# It also runs when tools/food_model/run-training.txt changes on this branch,
# so it can be started without merging (workflow_dispatch needs the main branch).
on:
  push:
    branches: [claude/phase-1-foundation]
    paths: [tools/food_model/run-training.txt]
  workflow_dispatch:
    inputs:
      dataset:
        description: "Kaggle dataset (owner/name). Check its licence allows commercial use."
        default: "iamsouravbanerjee/indian-food-images-dataset"
      epochs_head:
        description: "Epochs with the backbone frozen"
        default: "6"
      epochs_fine:
        description: "Epochs fine-tuning the top of the backbone"
        default: "4"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install tensorflow-cpu kaggle
      - name: Download photos
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "::error::Add KAGGLE_USERNAME and KAGGLE_KEY as repository secrets."; exit 1; }
          kaggle datasets download -d "${{ inputs.dataset || 'iamsouravbanerjee/indian-food-images-dataset' }}" -p data --unzip
          echo "FOOD_DIR=$(python tools/food_model/find_class_folder.py data)" >> "$GITHUB_ENV"
      - name: Train and export
        env:
          OUT_DIR: out
          IMG_SIZE: "192"
          EPOCHS_HEAD: ${{ inputs.epochs_head || '6' }}
          EPOCHS_FINE: ${{ inputs.epochs_fine || '4' }}
        run: python tools/food_model/train_indian_food_model.py 2>&1 | tee train.log
      - name: Summary
        run: |
          ls -la out
          grep -E "dishes:|Final validation" train.log | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Dataset: ${{ inputs.dataset || 'iamsouravbanerjee/indian-food-images-dataset' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Experiment, not for release until the photo licence is clear. $(grep -E 'dishes:|Final validation' train.log | tail -3 | tr '\n' ' ')"
          gh release delete food-model-experiment --yes --cleanup-tag || true
          gh release create food-model-experiment out/food_indian.tflite out/food_indian_labels.csv train.log \
            --prerelease --title "Food model (experiment)" --notes "$notes" --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v5
        with:
          name: food-model
          path: |
            out/food_indian.tflite
            out/food_indian_labels.csv
            train.log
