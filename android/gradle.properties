org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.1 officially lists compileSdk 36; 37 is needed by permission_handler.
android.suppressUnsupportedCompileSdk=37

# tflite_flutter compiles its Java for 11 but Kotlin for the JDK default; the
# mismatch is harmless on Android (D8 handles both), so warn instead of failing.
kotlin.jvm.target.validation.mode=warning
