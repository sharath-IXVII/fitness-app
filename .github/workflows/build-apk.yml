# Builds an installable test APK on every push to the working branches.
# Download it from the "Test build" release (phone-friendly) or from the
# run's artifacts. Signed with debug keys until a release keystore is set up
# (see docs/RELEASE.md), so it's for testing, not for the Play Store.
name: Build test APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      # The runner's disk is small; the app (maps, ML, Firebase) needs room
      # to build. Remove big tools this job never uses (about 25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # On-device food recognition: Google AIY Food V1 (Apache-2.0), bundled
      # into the app so scanning is free and works offline.
      # Google's backup food classifier. The app's own models come from the
      # food-detector release below, so a network hiccup here mustn't stop the build.
      - name: Download food model
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o assets/models/food_v1.tflite \
            "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv" \
            | tr -d '\r' > assets/models/food_labels.csv
          test "$(stat -c %s assets/models/food_v1.tflite)" -gt 1000000
          test "$(wc -l < assets/models/food_labels.csv)" -gt 2000
          ls -la assets/models

      # The trained food detector, if one has been published (release tag
      # "food-detector", see tools/food_model/README.md). Optional.
      - name: Download food detector (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download food-detector --repo "$GITHUB_REPOSITORY" --pattern 'food_detector*' --pattern 'food_dish*' --dir assets/models --clobber \
            && echo "Food detector added." || echo "No food detector yet; the classifier is used."

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          flutter test
          # Day maths must survive daylight-saving changes.
          TZ=Europe/Berlin flutter test test/dst_test.dart test/arc_test.dart
          TZ=America/New_York flutter test test/dst_test.dart

      # Release signing once the upload key is added as repository secrets
      # (see docs/LAUNCH_CHECKLIST.md). Without them the build uses debug keys.
      - name: Release signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          fail() { echo "::error title=Release signing setup::$1"; exit 1; }
          # Tolerate spaces or line breaks that crept in when pasting the secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null \
            || fail "KEYSTORE_BASE64 is not valid base64. Paste the whole contents of keystore-base64.txt again."
          size=$(stat -c %s "$RUNNER_TEMP/upload.jks")
          [ "$size" -gt 1000 ] || fail "KEYSTORE_BASE64 decoded to only $size bytes. It was probably cut off when pasting."
          [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ] \
            || fail "One of KEYSTORE_PASSWORD, KEY_ALIAS or KEY_PASSWORD is missing."
          if ! keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            fail "keytool could not open the key: $(head -c 300 "$RUNNER_TEMP/kt.txt" | tr '\n' ' ')"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          # The fingerprints are public; Firebase needs them for Google sign-in.
          fp=$(grep -E "SHA1:|SHA256:" "$RUNNER_TEMP/kt.txt" | tr -s ' ' | tr '\n' ' ')
          echo "::notice title=Signing key fingerprints::$fp"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --build-number=$((100 + GITHUB_RUN_NUMBER)) 2>&1 | tee build.log

      # Surfaces the Gradle error as an annotation on the run summary, so it's
      # readable without downloading the full log.
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || { echo "::notice::The build did not start (an earlier step failed)."; exit 0; }
          msg=$(grep -n -A25 -E "What went wrong|FAILURE:|^e: |error:|Error:" build.log | head -120)
          [ -z "$msg" ] && msg=$(tail -60 build.log)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=APK build failed::$msg"

      # The App Bundle is what Google Play needs (only useful once signed
      # with the release key).
      - name: Build App Bundle
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Play needs a higher version code for every upload; the run number only goes up.
        run: flutter build appbundle --release --build-number=$((100 + GITHUB_RUN_NUMBER))

      # Build files also go on the release below (no storage limit there), so
      # a full Actions storage quota must not fail the build.
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fitalarm-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # Keep build files only a few days so GitHub storage never fills up.
          retention-days: 5

      - name: Upload App Bundle
        continue-on-error: true
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: fit-tracker-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Publish "Test build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build (latest)
          prerelease: true
          make_latest: false
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.
            Install `app-release.apk` on an Android phone (allow "Install unknown apps" when asked).
            For Google Play, upload `app-release.aab` (when the build was signed).
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
