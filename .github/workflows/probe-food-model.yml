# One-off probe: can CI download the on-device food model, and which dishes
# does it know? Results are posted as annotations. Safe to delete.
name: Probe food model

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-food-model.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download
        shell: bash
        run: |
          set -x
          mkdir -p m && cd m
          curl -sSL -o model.tar.gz -w "kaggle %{http_code} %{size_download}\n" "https://www.kaggle.com/api/v1/models/google/aiy/tfLite/vision-classifier-food-v1/1/download" || true
          file model.tar.gz || true
          tar -tzf model.tar.gz || true
          curl -sSL -o labels.csv -w "labels %{http_code} %{size_download}\n" "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv" || true
          curl -sSL -o direct.tflite -w "tfhub %{http_code} %{size_download}\n" "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite" || true
          ls -la
      - name: Report
        if: always()
        shell: bash
        run: |
          cd m
          info=$(ls -la; echo; tar -tzf model.tar.gz 2>&1 | head; echo; head -c 200 direct.tflite | xxd | head -3; echo; wc -l labels.csv; head -5 labels.csv)
          info="${info//'%'/'%25'}"; info="${info//$'\n'/'%0A'}"
          echo "::notice title=files::$info"
          kw='biryani|dosa|idli|naan|roti|chapati|paratha|samosa|paneer|curry|dal|masala|tikka|pakora|jalebi|gulab|kheer|rice|khichdi|upma|poha|vada|pav|chole|rajma|raita|halwa|ladoo|thali|uttapam|bhaji|kofta|korma|tandoori|kebab|egg|omelet|sandwich|pizza|burger|noodle|pasta|salad|chicken|fish|dumpling|momo|fries|pancake|oat|banana|apple|mango'
          for chunk in 0 1 2 3; do
            m=$(grep -iE "$kw" labels.csv | sed -n "$((chunk*150+1)),$((chunk*150+150))p" | cut -d, -f2 | tr '\n' ';')
            [ -n "$m" ] && echo "::notice title=labels $chunk::${m//'%'/'%25'}"
          done
          echo "::notice title=total::$(grep -ciE "$kw" labels.csv) keyword matches of $(wc -l < labels.csv)"
